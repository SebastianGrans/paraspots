<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ParaSpots</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="map">
        <button id="locate-btn" title="Use my location" aria-label="Use my location">📍</button>
        <div id="locate-error" class="hidden">Couldn't get your location</div>
    </div>
    <div id="sidebar">
        <div id="takeoff-panel" class="placeholder">
            <p>Select a takeoff on the map<br />to see its details</p>
        </div>
        <div id="list-panel">
            <div id="list-toolbar">
                <input type="text" id="search" placeholder="Search takeoffs…" autofocus />
                <select id="sort">
                    <option value="name-asc">Name (A-Z)</option>
                    <option value="name-desc">Name (Z-A)</option>
                    <option value="distance" id="sort-distance-option" disabled>Distance</option>
                </select>
            </div>
            <ul id="list"></ul>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
