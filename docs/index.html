<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ParaSpots</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="map">
        <button id="locate-btn" title="Use my location" aria-label="Use my location">📍</button>
        <div id="locate-error" class="hidden">Couldn't get your location</div>
    </div>
    <div id="sidebar">
        <div id="takeoff-panel" class="placeholder">
            <p>Select a takeoff on the map<br />to see its details</p>
        </div>
        <div id="list-panel">
            <div id="list-toolbar">
                <div id="search-wrap">
                    <input type="text" id="search" placeholder="Search takeoffs…" autofocus />
                    <button id="clear-search" type="button" aria-label="Clear search">×</button>
                </div>
                <div id="sort-wrap">
                    <button id="sort-btn" type="button" aria-label="Sort">▲▼</button>
                    <div id="sort-menu" class="hidden">
                        <div class="sort-option" data-mode="name-asc">A-Z</div>
                        <div class="sort-option" data-mode="name-desc">Z-A</div>
                        <div class="sort-option" data-mode="distance-asc" data-requires-location="true">Dist. asc.</div>
                        <div class="sort-option" data-mode="distance-desc" data-requires-location="true">Dist. desc.</div>
                    </div>
                </div>
            </div>
            <ul id="list"></ul>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
